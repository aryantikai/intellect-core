<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="Intellect Core logo">
  <defs>
    <linearGradient id="ic-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e8bff"/>
      <stop offset="1" stop-color="#19c8ff"/>
    </linearGradient>
  </defs>
  <!-- mark -->
  <rect x="16" y="16" width="64" height="64" rx="17" fill="url(#ic-g)"/>
  <g transform="translate(16,16) scale(0.64)" stroke="#04121b" stroke-width="6" stroke-linecap="round" fill="#04121b">
    <path fill="none" d="M50 50V23 M50 50 26 66 M50 50 74 66"/>
    <circle cx="50" cy="23" r="7.5" stroke="none"/>
    <circle cx="26" cy="66" r="7.5" stroke="none"/>
    <circle cx="74" cy="66" r="7.5" stroke="none"/>
    <circle cx="50" cy="50" r="11" stroke="none"/>
  </g>
  <!-- wordmark (uses currentColor; set color via CSS, defaults dark) -->
  <text x="98" y="58" font-family="Sora, 'Segoe UI', Inter, system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5" fill="currentColor" style="color:#0b1426">
    Intellect <tspan fill="url(#ic-g)">Core</tspan>
  </text>
</svg>
